[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

# La función responde en /api gracias a "export const config = { path: '/api' }".
# Dejamos también un redirect explícito por compatibilidad.
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[functions]
  node_bundler = "esbuild"
